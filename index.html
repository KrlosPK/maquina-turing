<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividad 4 - Máquina de Turing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="icon" type="image/png" href="/favicon.png" />

    <script defer src="./script.js"></script>
    <style>
      #input {
        background-image: linear-gradient(
          to right,
          #d1d5db 0.5px,
          transparent 0
        );
        background-size: 16px 100%;
        font-family: monospace;
        letter-spacing: 8.2px;
        padding-left: 6px;
      }
    </style>
  </head>
  <body
    class="flex flex-col justify-center h-screen max-w-sm mx-auto scale-150"
  >
    <form class="flex flex-col mb-8" id="binaryForm">
      <h1 class="mb-6 text-2xl font-bold text-center">Máquina de Turing</h1>

      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium text-gray-900">
          Cinta de Entrada (Binario)
        </label>

        <input
          autocomplete="off"
          class="border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          id="input"
          maxlength="23"
          pattern="[01#]+"
          placeholder="Ejemplo: 0101#010"
          required
          title="Ingresa una cadena binaria (0, 1 y #)"
        />

        <small class="text-xs text-gray-500">
          Solo se permiten los caracteres 0, 1 y #
        </small>
      </div>

      <button
        class="relative cursor-pointer inline-flex items-center justify-center p-0.5 mb-2 me-2 overflow-hidden text-sm font-medium rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 text-white h-11"
        id="submitButton"
      >
        <span
          class="relative px-5 py-2.5 transition-all ease-in duration-75 rounded-md bg-transparent"
        >
          Calcular resultado
        </span>
      </button>
    </form>

    <article class="hidden p-4 bg-gray-200 rounded-lg" id="resultArticle">
      <h2 class="mb-6 text-xl font-bold">Traducción de la Entrada</h2>

      <p id="invalidBinaryMessage" class="hidden font-bold text-red-500">
        Entrada binaria inválida
      </p>

      <div id="resultContainer">
        <p class="mb-4">
          Entrada en Binario:
          <b><span id="binaryInput"></span></b>
        </p>

        <p class="mb-4">
          Conversión a Decimal:
          <b><span id="decimalOutput"></span></b>
        </p>

        <p>
          Resultado en Binario:
          <b><span id="turingResult"></span></b>
        </p>
      </div>
    </article>
  </body>
</html>
